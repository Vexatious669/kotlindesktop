name: Update

# Manual only. Runs the checks, then runs build.yml, then posts a patch note to Discord.
# Needs a repository secret named DISCORD_WEBHOOK_URL.
on:
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      total: ${{ steps.count.outputs.total }}
      passed: ${{ steps.count.outputs.passed }}
      failed: ${{ steps.count.outputs.failed }}
      skipped: ${{ steps.count.outputs.skipped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run checks
        run: .\gradlew check --no-daemon --no-configuration-cache

      - name: Count tests
        id: count
        run: |
          $total = 0; $failed = 0; $skipped = 0
          $files = Get-ChildItem -Recurse -Filter 'TEST-*.xml' |
            Where-Object { $_.FullName -match '[\\/]build[\\/]test-results[\\/]' }
          foreach ($file in $files) {
            $suite = ([xml](Get-Content -Raw $file.FullName)).testsuite
            $total += [int]$suite.tests
            $failed += [int]$suite.failures + [int]$suite.errors
            $skipped += [int]$suite.skipped
          }
          $passed = $total - $failed - $skipped
          "total=$total", "passed=$passed", "failed=$failed", "skipped=$skipped" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Tests: $passed passed, $failed failed, $skipped skipped, $total total"

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      run_url: ${{ steps.build.outputs.run_url }}
    steps:
      - name: Run build.yml and wait for it
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          started=$(date -u -d '-60 seconds' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build.yml --ref "$GITHUB_REF_NAME"

          id=""
          for _ in $(seq 1 30); do
            id=$(gh run list --workflow build.yml --event workflow_dispatch --branch "$GITHUB_REF_NAME" \
              --limit 10 --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$started\")] | sort_by(.createdAt) | last | .databaseId // empty")
            [ -n "$id" ] && break
            sleep 5
          done
          [ -n "$id" ] || { echo "The build.yml run did not appear."; exit 1; }

          echo "run_url=https://github.com/$GH_REPO/actions/runs/$id" >> "$GITHUB_OUTPUT"
          echo "Watching build.yml run $id"
          gh run watch "$id" --exit-status --interval 20

  notify:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ needs.build.outputs.run_url }}
          TOTAL: ${{ needs.check.outputs.total }}
          PASSED: ${{ needs.check.outputs.passed }}
          FAILED: ${{ needs.check.outputs.failed }}
          SKIPPED: ${{ needs.check.outputs.skipped }}
        run: |
          set -euo pipefail
          [ -n "$WEBHOOK" ] || { echo "The DISCORD_WEBHOOK_URL secret is not set."; exit 1; }

          tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          [ -n "$tag" ] || tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)

          if [ -n "$tag" ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            heading="Commits since $tag"
            all=$(git log --no-merges --pretty='format:- %s (%h)' "$tag..HEAD")
          else
            heading="Latest commits (no release yet)"
            all=$(git log --no-merges -n 20 --pretty='format:- %s (%h)')
          fi
          [ -n "$all" ] || all="- No new commits."

          commits=$(printf '%s\n' "$all" | awk -v max=3000 '
            { if (used + length($0) + 1 > max) { skipped++; next } print; used += length($0) + 1 }
            END { if (skipped) printf "...and %d more\n", skipped }')

          tests="$PASSED passed, $FAILED failed, $SKIPPED skipped ($TOTAL total)"
          description=$(printf '**Downloads**\n[Build artifacts](%s#artifacts)\n\n**Tests**\n%s\n\n**%s**\n%s' \
            "$RUN_URL" "$tests" "$heading" "$commits")

          payload=$(jq -n --arg description "$description" --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            allowed_mentions: { parse: [] },
            embeds: [{
              title: "AniLife new Patch!",
              description: $description,
              color: 5763719,
              timestamp: $timestamp
            }]
          }')

          curl -sS --fail-with-body -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK"
