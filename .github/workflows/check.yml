name: Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build, Test & Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Gradle checks
        id: gradle_check
        shell: bash
        run: |
          set +e
          ./gradlew check --continue --stacktrace 2>&1 | tee build.log
          GRADLE_STATUS=${PIPESTATUS[0]}
          echo "exit_code=$GRADLE_STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate test report with GitHub source links
        if: always()
        env:
          GRADLE_EXIT_CODE: ${{ steps.gradle_check.outputs.exit_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re
          import xml.etree.ElementTree as ET

          exit_code = int(os.environ.get("GRADLE_EXIT_CODE", "1"))
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          commit = os.environ.get("GITHUB_SHA", "")
          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")

          log_lines = []
          if os.path.exists("build.log"):
              with open("build.log", encoding="utf-8", errors="replace") as f:
                  log_lines = [line.rstrip() for line in f]

          warnings = []
          build_errors = []

          for line in log_lines:
              stripped = line.strip()
              if re.search(r'\bw:\s+|warning:', stripped, re.I):
                  if stripped not in warnings:
                      warnings.append(stripped)
              if re.search(r'\be:\s+|error:|FAILURE:|> Task .* FAILED', stripped):
                  if stripped not in build_errors:
                      build_errors.append(stripped)

          def source_link(module, class_name, trace):
              """
              Resolve a test class to its source file and link to the
              exact commit that produced this workflow run.
              """
              class_name = class_name.split("$")[0]
              relative_class = class_name.replace(".", "/")

              roots = [
                  f"{module}/src/test/kotlin",
                  f"{module}/src/test/java",
                  f"{module}/src/commonTest/kotlin",
                  "src/test/kotlin",
                  "src/test/java",
              ]

              source_path = None
              for root in roots:
                  for extension in (".kt", ".java"):
                      candidate = f"{root}/{relative_class}{extension}"
                      if os.path.isfile(candidate):
                          source_path = candidate
                          break
                  if source_path:
                      break

              if not source_path:
                  return None

              line_number = None
              filename = os.path.basename(source_path)

              for match in re.finditer(
                  rf'\({re.escape(filename)}:(\d+)\)', trace
              ):
                  line_number = match.group(1)
                  break

              url = (
                  f"{server}/{repository}/blob/{commit}/{source_path}"
              )

              if line_number:
                  url += f"#L{line_number}"

              return f"[`{class_name}`]({url})"

          xml_files = sorted(
              glob.glob("**/build/test-results/**/*.xml", recursive=True)
          )

          total_tests = 0
          total_failures = 0
          total_errors = 0
          total_skipped = 0
          total_time = 0.0

          module_stats = {}
          failed_cases = []
          skipped_cases = []
          suite_rows = []

          for xml_path in xml_files:
              parts = xml_path.replace("\\", "/").split("/")
              module = (
                  parts[0]
                  if len(parts) > 1 and parts[0] != "build"
                  else "root"
              )

              try:
                  root = ET.parse(xml_path).getroot()
              except Exception as exc:
                  build_errors.append(
                      f"Could not parse {xml_path}: {exc}"
                  )
                  continue

              suites = (
                  [root]
                  if root.tag == "testsuite"
                  else root.findall("testsuite")
              )

              for suite in suites:
                  suite_name = suite.attrib.get("name", "unknown")
                  tests = int(suite.attrib.get("tests", 0))
                  failures = int(suite.attrib.get("failures", 0))
                  errors = int(suite.attrib.get("errors", 0))
                  skipped = int(suite.attrib.get("skipped", 0))
                  duration = float(suite.attrib.get("time", 0))
                  bad = failures + errors
                  passed = max(0, tests - bad - skipped)

                  total_tests += tests
                  total_failures += failures
                  total_errors += errors
                  total_skipped += skipped
                  total_time += duration

                  stats = module_stats.setdefault(
                      module,
                      {
                          "passed": 0,
                          "total": 0,
                          "failed": 0,
                          "skipped": 0,
                          "time": 0.0,
                      },
                  )

                  stats["passed"] += passed
                  stats["total"] += tests
                  stats["failed"] += bad
                  stats["skipped"] += skipped
                  stats["time"] += duration

                  suite_rows.append(
                      (
                          "FAIL" if bad else "PASS",
                          module,
                          suite_name,
                          passed,
                          tests,
                          bad,
                          skipped,
                          duration,
                      )
                  )

                  for case in suite.findall("testcase"):
                      case_name = case.attrib.get("name", "unknown")
                      class_name = case.attrib.get(
                          "classname", suite_name
                      )

                      skipped_node = case.find("skipped")
                      if skipped_node is not None:
                          skipped_cases.append(
                              (
                                  module,
                                  class_name,
                                  case_name,
                                  skipped_node.attrib.get(
                                      "message", "Skipped"
                                  ),
                              )
                          )

                      for tag in ("failure", "error"):
                          node = case.find(tag)
                          if node is None:
                              continue

                          message = node.attrib.get(
                              "message", "Test failed"
                          )
                          trace = (node.text or "").strip()

                          link = source_link(
                              module, class_name, trace
                          )

                          failed_cases.append(
                              (
                                  module,
                                  class_name,
                                  case_name,
                                  message,
                                  trace,
                                  link,
                              )
                          )

          total_bad = total_failures + total_errors
          total_passed = max(
              0, total_tests - total_bad - total_skipped
          )
          executed = max(0, total_tests - total_skipped)
          pass_rate = (
              total_passed / executed * 100
              if executed else 0
          )

          success = (
              exit_code == 0
              and total_bad == 0
              and total_tests > 0
          )

          headline = "SUCCESS" if success else "FAILED"
          report = []

          report.append(f"## AniLife Check Report: {headline}")
          report.append("")
          report.append(f"**Commit:** [`{commit[:12]}`]({server}/{repository}/commit/{commit})")
          report.append("")
          report.append("### Summary")
          report.append("")
          report.append("| Metric | Result |")
          report.append("|---|---:|")
          report.append(f"| Status | **{headline}** |")
          report.append(f"| Passed | {total_passed} / {total_tests} |")
          report.append(f"| Failed / Errored | {total_bad} |")
          report.append(f"| Skipped | {total_skipped} |")
          report.append(f"| Warnings | {len(warnings)} |")
          report.append(f"| Duration | {total_time:.2f}s |")
          report.append(f"| Gradle exit code | `{exit_code}` |")
          report.append("")

          if module_stats:
              report.append("### Module Totals")
              report.append("")
              report.append(
                  "| Module | Passed | Failed | Skipped | Time |"
              )
              report.append("|---|---:|---:|---:|---:|")

              for module, stats in sorted(module_stats.items()):
                  report.append(
                      f"| `:{module}` | {stats['passed']}/{stats['total']} "
                      f"| {stats['failed']} | {stats['skipped']} "
                      f"| {stats['time']:.2f}s |"
                  )

              report.append("")

          if suite_rows:
              report.append("### Test Suites")
              report.append("")
              report.append(
                  "| Status | Module | Suite | Passed | Failed | Skipped |"
              )
              report.append("|---|---|---|---:|---:|---:|")

              for status, module, suite, passed, tests, bad, skipped, duration in suite_rows:
                  report.append(
                      f"| {status} | `:{module}` | `{suite}` "
                      f"| {passed}/{tests} | {bad} | {skipped} |"
                  )

              report.append("")

          report.append(f"### Failed Tests ({len(failed_cases)})")
          report.append("")

          if failed_cases:
              for module, class_name, case_name, message, trace, link in failed_cases:
                  report.append(f"- **{case_name}**")
                  report.append(f"  - Module: `:{module}`")

                  if link:
                      report.append(f"  - Test source: {link}")
                  else:
                      report.append(
                          f"  - Test class: `{class_name}` "
                          "(source file not found)"
                      )

                  report.append(f"  - Error: `{message}`")

                  if trace:
                      report.append("  <details>")
                      report.append("  <summary>Stack trace</summary>")
                      report.append("")
                      report.append("  ```text")
                      report.extend(
                          "  " + line
                          for line in trace.splitlines()[:30]
                      )
                      report.append("  ```")
                      report.append("  </details>")

                  report.append("")
          else:
              report.append("No failed tests detected.")
              report.append("")

          report.append(f"### Build Errors ({len(build_errors)})")
          report.append("")

          if build_errors:
              report.append("```text")
              report.extend(build_errors[:60])
              report.append("```")
          else:
              report.append("No build errors detected.")

          report.append("")
          report.append(f"### Warnings ({len(warnings)})")
          report.append("")

          if warnings:
              report.append("```text")
              report.extend(warnings[:60])
              report.append("```")
          else:
              report.append("No warnings detected.")

          if skipped_cases:
              report.append("")
              report.append(f"### Skipped Tests ({len(skipped_cases)})")
              report.append("")

              for module, class_name, case_name, reason in skipped_cases:
                  report.append(
                      f"- `:{module}` `{class_name}.{case_name}` "
                      f"({reason})"
                  )

          markdown = "\n".join(report)
          print(markdown)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(markdown + "\n")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anilife-check-reports
          path: |
            build.log
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate final Gradle status
        if: always()
        shell: bash
        env:
          GRADLE_EXIT_CODE: ${{ steps.gradle_check.outputs.exit_code }}
        run: |
          if [ "$GRADLE_EXIT_CODE" != "0" ]; then
            echo "::error::Gradle checks failed with exit code $GRADLE_EXIT_CODE"
            exit 1
          fi
